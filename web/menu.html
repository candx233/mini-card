<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniCard · Menu</title>
<style>
  /* ─── 界面字体：MiSans（子集与许可见 web/fonts/，与 card.html 同源） ─── */
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 400; font-display: block; src: url("fonts/MiSans-Regular.woff2") format("woff2"); }
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 500; font-display: block; src: url("fonts/MiSans-Medium.woff2") format("woff2"); }
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 600; font-display: block; src: url("fonts/MiSans-Semibold.woff2") format("woff2"); }
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 700; font-display: block; src: url("fonts/MiSans-Bold.woff2") format("woff2"); }
  :root {
    --fg:      oklch(0.966 0.005 258.3);
    --muted:   oklch(0.85 0.02 261.1);
    --tshadow: oklch(0 0 0 / 0.45);
    --border:  oklch(1 0 0 / 0.10);
    --accent:  oklch(0.685 0.168 256.0);
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --danger:  oklch(0.630 0.190 25.0);
    --bg:      oklch(0.210 0.025 255.0);
    --font-body: 'MiSans', 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    /* 菜单底色 = 气泡那一对变量（与 dock.html 的右键菜单同源）：暗主题深底白字、亮主题白底深字 */
    --bubble-bg: color-mix(in oklch, var(--bg) 84%, transparent);
    --bubble-fg: var(--fg);
    /* 窗口比菜单盒多出的投影余量（上/左右 12、下 8）—— 值要与 Rust 的 PAD_* 一致 */
    --pad-top: 12px;
    --pad-x: 12px;
    --pad-bottom: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
    color: var(--fg); font-family: var(--font-body); font-size: 13.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  /* ─── 菜单盒（形态按 tray-menu-plan §三：宽 168 / 行高 32 / 圆角 12 / 项内左右 10）───
     投影下沿 = 3 + 10/2 = 8px，正好等于 --pad-bottom：不越过投影余量，也就不会压到托盘图标上 */
  .menu {
    width: 168px; padding: 6px; border-radius: 12px;
    background: var(--bubble-bg); border: 1px solid var(--border);
    box-shadow: 0 3px 10px color-mix(in oklch, oklch(0 0 0) 40%, transparent);
    display: flex; flex-direction: column; gap: 2px;
  }
  .mi {
    appearance: none; -webkit-appearance: none; border: 0; background: none;
    font-family: inherit; font-size: 13.5px; line-height: 20px; color: var(--bubble-fg);
    text-align: left; height: 32px; padding: 0 10px; border-radius: 8px;
    display: flex; align-items: center; white-space: nowrap; cursor: default;
  }
  .mi:hover { background: var(--accent-soft); }
  .mi:active { background: color-mix(in oklch, var(--accent) 22%, transparent); }
  .mi.danger:hover { background: color-mix(in oklch, var(--danger) 14%, transparent); }
</style>
</head>
<body>
  <div class="menu" id="menu" role="menu">
    <button class="mi" data-id="show" type="button" role="menuitem">显示主窗口</button>
    <button class="mi danger" data-id="quit" type="button" role="menuitem">退出 Mini Card</button>
  </div>
<script>
(function () {
  var T = window.__TAURI__;
  var params = new URLSearchParams(location.search);

  /* ── 明暗（与 dock.html 同一套口径；save_config 时 Rust 会推 __setTheme 过来） ── */
  window.__setTheme = function (dark) {
    var r = dark ? null : { fg: 'oklch(0.28 0.02 258)', muted: 'oklch(0.47 0.02 261)', border: 'oklch(0 0 0 / 0.10)' };
    var s = document.documentElement.style;
    s.setProperty('--fg', r ? r.fg : 'oklch(0.966 0.005 258.3)');
    s.setProperty('--muted', r ? r.muted : 'oklch(0.85 0.02 261.1)');
    s.setProperty('--tshadow', r ? 'oklch(1 0 0 / 0.6)' : 'oklch(0 0 0 / 0.45)');
    s.setProperty('--border', r ? r.border : 'oklch(1 0 0 / 0.10)');
    s.setProperty('--bubble-bg', r ? 'oklch(1 0 0 / 0.88)' : 'color-mix(in oklch, oklch(0.210 0.025 255.0) 84%, transparent)');
    s.setProperty('--bubble-fg', r ? 'oklch(0.28 0.02 258)' : 'oklch(0.966 0.005 258.3)');
  };
  if (params.get('dark') === '0') window.__setTheme(false);

  /* ── 动作：一切显隐都走 Rust（页面里 getCurrentWindow().hide() 会被 ACL 拦，tray-menu-plan 坑 #3） ── */
  function close() { try { T.core.invoke('menu_close'); } catch (e) { /* 窗口正在销毁 */ } }
  function pick(id) { try { T.core.invoke('menu_pick', { id: id }); } catch (e) { } }

  document.querySelectorAll('.mi').forEach(function (b) {
    b.addEventListener('click', function () { pick(b.dataset.id); });
  });
  // ESC 关闭（菜单窗可激活、拿得到键盘焦点）
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); close(); }
  }, true);
  // 点在菜单盒**外**（投影余量那圈透明区）→ 关闭；盒内按下不动（原生菜单同款）
  document.addEventListener('mousedown', function (e) {
    if (!(e.target.closest && e.target.closest('#menu'))) close();
  }, true);
})();
</script>
</body>
</html>
