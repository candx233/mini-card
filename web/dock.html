<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MiniCard · Dock</title>
<style>
  /* ─── 界面字体：MiSans（子集与许可见 web/fonts/，与 card.html 同源） ─── */
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 400; font-display: block; src: url("fonts/MiSans-Regular.woff2") format("woff2"); }
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 500; font-display: block; src: url("fonts/MiSans-Medium.woff2") format("woff2"); }
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 600; font-display: block; src: url("fonts/MiSans-Semibold.woff2") format("woff2"); }
  @font-face { font-family: 'MiSans'; font-style: normal; font-weight: 700; font-display: block; src: url("fonts/MiSans-Bold.woff2") format("woff2"); }
  :root {
    --surface: oklch(0.966 0.005 258.3 / 0.08);
    --fg:      oklch(0.966 0.005 258.3);
    --muted:   oklch(0.85 0.02 261.1);
    --tshadow: oklch(0 0 0 / 0.45);
    --border:  oklch(1 0 0 / 0.10);
    --accent:  oklch(0.685 0.168 256.0);
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --danger:  oklch(0.630 0.190 25.0);
    --bg:      oklch(0.210 0.025 255.0);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --font-body: 'MiSans', 'Segoe UI', system-ui, 'Microsoft YaHei', sans-serif;
    --font-mono: 'MiSans', 'Cascadia Mono', 'Consolas', ui-monospace, monospace;
    /* 气泡：暗底白字（亮壁纸上也读得清）；亮主题在 __setTheme 里翻过来 */
    --bubble-bg: color-mix(in oklch, var(--bg) 84%, transparent);
    --bubble-fg: var(--fg);
    /* Dock 规格（docs/dock-plan.md §1；JS 按 URL 参数覆盖） */
    --icon: 48px;        /* 图标边长 32/40/48/56 */
    --gap: 12px;         /* 图标间距 */
    --pad: 12px;         /* 左右内边距 */
    --bar-h: 64px;       /* 玻璃条高 = 图标 + 上下留白 8×2 */
    --radius-dock: 20px; /* 比卡片 16 更圆 */
    --radius-item: 11px; /* 48px 图标的圆角（≈23%，Windows 图标规范同量级） */
    --margin-top: 28px;  /* 窗口高 = 玻璃条 + 放大余量（窗口上方的透明区） */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    color: var(--fg); font-family: var(--font-body); font-size: 13px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  /* 整窗就是「玻璃条 + 上方 28px 透明余量」：条贴底边，圆角裁在 .barwrap 上，
     条目放在 .dock 直下（不裁），放大时向上顶进余量区。 */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar-h);
    border-radius: var(--radius-dock);
    background: none;
  }
  .barwrap { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: 0; }
  .wall {                                  /* 磨砂层：壁纸切片 + blur（inset 与位置由 JS 算） */
    position: absolute; inset: calc(-1 * var(--wall-pad, 120px));
    background-repeat: no-repeat; background-size: 0 0;
    filter: blur(30px);
  }
  .veil {                                  /* 白纱层：玻璃厚度（--surface 的 alpha）+ 描边 */
    position: absolute; inset: 0; z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: inherit;
    pointer-events: none;
  }
  .items {
    position: relative; z-index: 2;
    height: 100%; display: flex; align-items: flex-end; justify-content: center;
    gap: var(--gap); padding: 0 var(--pad) 8px;
  }
  .item {
    position: relative; flex: 0 0 auto;
    width: var(--icon); height: var(--icon);
    border-radius: var(--radius-item);
    display: grid; place-items: center;
    background: var(--fg-soft);
    border: 1px solid var(--border);
    color: var(--fg);
    /* 放大走**独立的 scale 属性**（rAF 逐帧写），transform 留给启动弹跳的 keyframes —— 两条互不打架；
       也不写 transition：逐帧值再叠过渡会互相拖后腿（skill「动效铁律」） */
    transform-origin: bottom center;
  }
  /* 图标自己裁圆角（条目框 overflow 必须可见，运行指示点要落在图标外面、贴到条上） */
  .item img { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; border-radius: var(--radius-item); }
  .item .glyph {
    font-family: var(--font-mono); font-weight: 600; font-size: 20px;
    color: color-mix(in oklch, var(--fg) 88%, transparent);
    text-shadow: 0 0.833px 1.667px var(--tshadow);
  }
  .item.running::after {                   /* 运行中指示点（稿：4×4、bottom -5px、留 4px 余量别贴条底边）
                                              条目放大时用 --ki=1/k 抵掉：点恒 4px、恒在图标底下 5px */
    content: ""; position: absolute; left: 50%; bottom: calc(-5px * var(--ki, 1)); transform: translateX(-50%);
    width: calc(4px * var(--ki, 1)); height: calc(4px * var(--ki, 1)); border-radius: 999px;
    background: var(--fg); opacity: 0.85;
  }
  .item.busy { opacity: 0.65; }
  /* 启动反馈：向上弹一下（稿：translateY(-10px)），一次性 keyframes */
  @keyframes dock-bounce {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(-10px) scale(1.06); }
    60%  { transform: translateY(0) scale(1); }
    78%  { transform: translateY(-3px) scale(1.02); }
    100% { transform: translateY(0) scale(1); }
  }
  .item.launching { animation: dock-bounce 0.44s cubic-bezier(0.22, 0.68, 0.3, 1) 1; }
  /* 气泡：悬停显名字 / 启动时显「启动中…」（落在上方 28px 余量里，不挡条） */
  .bubble {
    position: absolute; bottom: calc(var(--bar-h) + 6px); left: 50%;
    transform: translateX(-50%) translateY(2px);
    max-width: 90%; padding: 2px 8px; border-radius: 8px;
    background: var(--bubble-bg);
    border: 1px solid var(--border);
    color: var(--bubble-fg); font-size: 12px; line-height: 18px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    opacity: 0; pointer-events: none;
    transition: opacity 0.12s ease-out, transform 0.12s ease-out;
    z-index: 5;
  }
  .bubble.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty-hint {                            /* 无条目时的空态（骨架期可见，方便验收） */
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    color: color-mix(in oklch, var(--fg) 62%, transparent);
    font-size: 12px; white-space: nowrap; pointer-events: none;
  }
  /* ─── F1 拖入插入标线：拖 exe/lnk 到条上时标出「会插到第几位」─── */
  .dropmark {
    position: absolute; z-index: 6; bottom: 8px; width: 2px; height: var(--icon);
    margin-left: -1px; border-radius: 1px;
    background: var(--accent);
    box-shadow: 0 0 6px color-mix(in oklch, var(--accent) 55%, transparent);
    pointer-events: none;
  }
  .dropmark[hidden] { display: none; }
  /* ─── F2 右键菜单：长在玻璃条上方（窗口按菜单高度临时长高，见 dock_menu）───
     形态按项目菜单语言（同 docs/tray-menu-plan.md §三）：行高 32 / 圆角 12 / 项内左右 10；
     底色用气泡那对变量（暗主题深底白字、亮主题白底深字，跟悬停名字气泡同一套） */
  .menu {
    position: absolute; z-index: 20; bottom: calc(var(--bar-h) + 6px); left: 0;
    min-width: 168px; padding: 6px; border-radius: 12px;
    background: var(--bubble-bg); border: 1px solid var(--border);
    box-shadow: 0 6px 18px color-mix(in oklch, oklch(0 0 0) 34%, transparent);
    display: flex; flex-direction: column; gap: 2px;
  }
  .menu[hidden] { display: none; }
  .menu .mi {
    appearance: none; -webkit-appearance: none; border: 0; background: none;
    font-family: inherit; font-size: 13.5px; line-height: 20px; color: var(--bubble-fg);
    text-align: left; height: 32px; padding: 0 10px; border-radius: 8px;
    display: flex; align-items: center; white-space: nowrap; cursor: default;
  }
  .menu .mi:hover { background: var(--accent-soft); }
  .menu .mi:active { background: color-mix(in oklch, var(--accent) 22%, transparent); }
  .menu .mi[disabled] { opacity: 0.42; }
  .menu .mi.danger:hover { background: color-mix(in oklch, var(--danger) 14%, transparent); }
</style>
</head>
<body>
  <div class="dock" id="dock">
    <div class="barwrap">
      <div class="wall" id="wall"></div>
      <div class="veil"></div>
    </div>
    <div class="items" id="items"></div>
    <div class="dropmark" id="dropmark" hidden></div>
    <div class="menu" id="menu" role="menu" hidden></div>
    <div class="bubble" id="bubble"></div>
    <div class="empty-hint" id="empty">Dock 上还没有应用</div>
  </div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var T = window.__TAURI__;

  /* ── 尺寸档（32/40/48/56）：条高 = 图标 + 16，圆角/间距按稿固定 ── */
  var SIZE = Number(params.get('size')) || 48;
  var MAG = Number(params.get('mag'));
  if (!isFinite(MAG)) MAG = 55;
  function applySizing() {
    var s = document.documentElement.style;
    s.setProperty('--icon', SIZE + 'px');
    s.setProperty('--bar-h', (SIZE + 16) + 'px');
    barOffsetY = (window.innerHeight || (SIZE + 16 + 28)) - (SIZE + 16);   // 玻璃条顶边在窗口内的 y
    KMAX = kMaxNow();                                                       // 放大上限跟着档位走
    drawWall();
  }
  window.__onResize = function () { applySizing(); };

  /* ── 玻璃厚度 / 模糊 / 明暗（与 card.html 同口径） ── */
  function setGlass(v) {
    var a = Math.max(0, Math.min(100, Number(v) || 0)) / 100 * 0.30;
    document.documentElement.style.setProperty('--surface', 'oklch(0.966 0.005 258.3 / ' + a.toFixed(3) + ')');
  }
  window.__setGlass = setGlass;
  setGlass(params.get('glass') || 30);
  window.__setTheme = function (dark) {
    var r = dark ? null : { fg: 'oklch(0.28 0.02 258)', muted: 'oklch(0.47 0.02 261)', border: 'oklch(0 0 0 / 0.10)' };
    var s = document.documentElement.style;
    s.setProperty('--fg', r ? r.fg : 'oklch(0.966 0.005 258.3)');
    s.setProperty('--muted', r ? r.muted : 'oklch(0.85 0.02 261.1)');
    s.setProperty('--tshadow', r ? 'oklch(1 0 0 / 0.6)' : 'oklch(0 0 0 / 0.45)');
    s.setProperty('--border', r ? r.border : 'oklch(1 0 0 / 0.10)');
    // 气泡跟着主题翻：亮主题 = 白底深字（暗主题是 --bg 暗底 + 白字）
    s.setProperty('--bubble-bg', r ? 'oklch(1 0 0 / 0.88)' : 'color-mix(in oklch, oklch(0.210 0.025 255.0) 84%, transparent)');
    s.setProperty('--bubble-fg', r ? 'oklch(0.28 0.02 258)' : 'oklch(0.966 0.005 258.3)');
  };
  if (params.get('dark') === '0') window.__setTheme(false);

  /* ── 磨砂层：壁纸切片 + CSS blur（与 card.html 同一套数学；条贴窗口底边 → 加 barOffsetY） ── */
  var wallEl = document.getElementById('wall');
  var wallImg = null, wallPos = [0, 0], wallMon = [0, 0], wallGeo = null, wallPad = 120;
  var barOffsetY = 0;
  function drawWall() {
    if (!wallEl || !wallGeo || !wallImg) return;
    wallEl.style.backgroundImage = 'url("' + wallImg + '")';
    wallEl.style.backgroundSize = wallGeo.bw.toFixed(1) + 'px ' + wallGeo.bh.toFixed(1) + 'px';
    // 玻璃条左上角的屏幕坐标 = 窗口坐标 + (0, 窗口高 − 条高)
    wallEl.style.backgroundPosition =
      (-(wallGeo.ox + wallPos[0] - wallPad)).toFixed(1) + 'px ' +
      (-(wallGeo.oy + wallPos[1] + barOffsetY - wallPad)).toFixed(1) + 'px';
  }
  function setBlur(v) {
    if (!wallEl) return;
    var r = Math.max(0, Math.min(100, Number(v) || 0));
    wallPad = Math.max(60, r * 3);   // inset 至少 3× 半径，模糊软边落在条外
    wallEl.style.setProperty('--wall-pad', wallPad + 'px');
    wallEl.style.filter = 'blur(' + r + 'px)';
    drawWall();
  }
  function setWall(p) {
    if (!p || !p.wall) return;
    wallImg = p.wall;
    var sw = p.mon[0], sh = p.mon[1];
    wallMon = [sw, sh];
    if (p.pos) wallPos = p.pos;
    if (p.blur != null) setBlur(p.blur);
    var im = new Image();
    im.onload = function () {
      var k = Math.max(sw / im.naturalWidth, sh / im.naturalHeight);   // Windows「填充」= cover
      wallGeo = { bw: im.naturalWidth * k, bh: im.naturalHeight * k,
                  ox: (im.naturalWidth * k - sw) / 2, oy: (im.naturalHeight * k - sh) / 2 };
      drawWall();
    };
    im.src = p.wall;
  }
  window.__setWall = setWall;
  window.__setBlur = setBlur;
  window.__getWall = function () { return { mon: wallMon, pos: wallPos, pad: wallPad, geo: wallGeo, barOffsetY: barOffsetY }; };

  /* ── 条目渲染 ── */
  var itemsEl = document.getElementById('items');
  var emptyEl = document.getElementById('empty');
  function iconUrl(path) {
    if (T && T.core && T.core.convertFileSrc) {
      try { return T.core.convertFileSrc(path); } catch (e) { /* 落到原路径 */ }
    }
    return path;
  }
  function initial(name) {
    var s = (name || '?').trim();
    return s ? s.charAt(0).toUpperCase() : '?';
  }
  function renderItems(items) {
    items = items || [];
    // 运行态：payload 里带 `running`（get_dock 那条路）→ 先按它铺一遍；
    // 之后真条还有 2s 一轮的 __setRunning 推送来精修（预览 iframe 就靠这份轮询）
    if (items.length && Object.prototype.hasOwnProperty.call(items[0], 'running')) {
      RUNNING = {};
      items.forEach(function (it) { if (it.running) RUNNING[it.id] = true; });
    }
    itemsEl.innerHTML = '';
    items.forEach(function (it) {
      var el = document.createElement('div');
      el.className = 'item';
      el.dataset.id = it.id || '';
      el.dataset.name = it.name || '';
      el.dataset.path = it.path || '';
      el.setAttribute('aria-label', it.name || '');   // 名字走 HTML 气泡，不用 title（会和气泡重复一坨原生提示）
      el.removeAttribute('title');
      if (it.icon) {
        var img = document.createElement('img');
        img.alt = '';
        img.draggable = false;
        img.src = iconUrl(it.icon);
        el.appendChild(img);
      } else {
        var g = document.createElement('span');
        g.className = 'glyph';
        g.textContent = initial(it.name);
        el.appendChild(g);
      }
      itemsEl.appendChild(el);
    });
    emptyEl.style.display = items.length ? 'none' : 'block';
    applyRunning();     // 重建后按记忆补回指示点（不然每轮 __setDock 都把点擦掉）
    syncMagBoxes();     // 同理补回放大（按当前指针位置直接就位）
  }
  window.__setDock = function (p) {
    if (!p) return;
    if (p.size) { SIZE = Number(p.size) || SIZE; }
    if (isFinite(Number(p.mag))) { MAG = Number(p.mag); }
    applySizing();
    renderItems(p.items);
  };
  window.__getDock = function () { return { size: SIZE, mag: MAG, count: itemsEl.children.length }; };

  /* ── D1 运行中指示点：Rust 每 2s 推一次 id 表；重建 DOM 后要按记忆补回（动画铁律） ── */
  var RUNNING = {};
  function applyRunning() {
    Array.prototype.forEach.call(itemsEl.children, function (el) {
      el.classList.toggle('running', !!RUNNING[el.dataset.id]);
    });
  }
  window.__setRunning = function (map) {
    RUNNING = map || {};
    applyRunning();
  };
  window.__getRunning = function () { return RUNNING; };

  /* ── E1 悬停放大（dock-plan P3）：rAF 逐帧写 scale，按鼠标距离衰减 ──
     k = 1 + mag/100 · exp(−(d/(iconW·1.3))²)；两稿标定 mag=55 → 中心 1.55 / 邻位 1.22 / 再远 1.01
     上限 1 + 36/size：图标底距窗口底 8px，再高就顶出窗口被裁（48 档 → 1.75）
     铁律：不用无记忆 CSS 动画 —— 这里每帧都由「指针位置」算出来，窗口重建 / resize 都不存在重放 */
  var KMAX = 1.75, GROWN = false, GROWN_REQ = false;
  var IN_WIN = false, MX = -1e9, CURS = [], RAF = 0, RAF_T = 0;
  var PT_N = 0, HOVER_N = 0, HOVER_ERR = '';   // 诊断计数（验收探针读 __getMag）
  function kMaxNow() { return 1 + 36 / SIZE; }
  function kOf(d) {
    var k = 1 + (MAG / 100) * Math.exp(-Math.pow(d / (SIZE * 1.3), 2));
    return k > KMAX ? KMAX : k;
  }
  function centers() {
    var out = [];
    Array.prototype.forEach.call(itemsEl.children, function (el) {
      out.push(el.offsetLeft + el.offsetWidth / 2);   // 中心 x（窗内 CSS px；scale 不改布局盒）
    });
    return out;
  }
  function applyMag(ks) {
    Array.prototype.forEach.call(itemsEl.children, function (el, i) {
      var v = ks[i] || 1;
      if (v > 1.0005) {
        el.style.scale = String(v);
        el.style.setProperty('--ki', String(1 / v));   // 指示点反缩放（保持 4px）
      } else {
        el.style.scale = '';
        el.style.removeProperty('--ki');
      }
    });
  }
  function rafTick(t) {
    RAF = 0;
    var dt = RAF_T ? Math.min(0.12, (t - RAF_T) / 1000) : 0.016;
    RAF_T = t;
    var cs = centers();
    if (CURS.length !== cs.length) CURS = cs.map(function () { return 1; });
    var a = 1 - Math.exp(-dt / 0.045);        // 45ms 时间常数：跟手，松手缓出
    var busy = false;
    for (var i = 0; i < cs.length; i++) {
      // 菜单开着时图标一概回落到 1.0（菜单就长在图标上方，放大只会互相压）
      var tgt = (IN_WIN && !MENU_OPEN) ? kOf(Math.abs(MX - cs[i])) : 1;
      if (Math.abs(tgt - CURS[i]) < 0.002) { CURS[i] = tgt; continue; }
      CURS[i] += (tgt - CURS[i]) * a;
      busy = true;
    }
    applyMag(CURS);
    if (busy) startRaf(); else RAF_T = 0;
  }
  function startRaf() { if (!RAF) RAF = requestAnimationFrame(rafTick); }
  function syncMagBoxes() {   // 条目重建后按当前指针位置**直接就位**（不闪回 1，再缓动到新目标）
    var cs = centers();
    CURS = cs.map(function (cx) { return IN_WIN ? kOf(Math.abs(MX - cx)) : 1; });
    applyMag(CURS);
    if (IN_WIN) startRaf();
  }
  window.__getMag = function () {
    return { mag: MAG, size: SIZE, kMax: kMaxNow(), inWin: IN_WIN, pointerX: IN_WIN ? MX : null,
             grown: GROWN, innerH: window.innerHeight, barTop: barTopY(), k: CURS.slice(),
             pt: PT_N, hoverReq: GROWN_REQ, hoverOk: HOVER_N, hoverErr: HOVER_ERR,
             rects: Array.prototype.map.call(itemsEl.children, function (el) {
               var r = el.getBoundingClientRect();
               return [+r.left.toFixed(2), +r.top.toFixed(2), +r.width.toFixed(2), +r.height.toFixed(2)];
             }) };
  };
  window.__setMag = function (x) {   // 验收用：不开真鼠标也能把指针 x 钉到某个位置
    IN_WIN = x !== null && x >= 0;
    MX = IN_WIN ? x : -1e9;
    startRaf();
  };
  window.__hitItem = function (x, y) {   // 验收用：这个点（窗内 CSS px）会激活哪个条目（点图标用的是同一个函数）
    var el = itemAtPoint(x, y);
    return el ? (el.dataset.id || '') : null;
  };
  /* 指针位置只认 Rust 推来的**真光标**（窗口内 CSS px；null = 光标不在 Dock 那一带）。
     为什么不吃自己的 mousemove：WebView2 会在窗口几何变化前后补发坐标不实的合成 mousemove
     （实测：光标明明在余量带里，收到的却是 (62, 90) 这种点）→ 「长高/缩回」会被带成来回抖。
     所以：Rust 每 25/80ms 读一次 GetCursorPos 推过来，页面只做纯函数判断。 */
  window.__setPointer = function (x, y) {
    PT_N++;
    var out = (x === null || y === null || x < 0 || x > (window.innerWidth || 0) || y < -1e3);
    if (out) {                       // 光标不在 Dock 那一带
      closeMenu();
      IN_WIN = false; MX = -1e9; startRaf(); setGrown(false);
      return;
    }
    var inBar = y >= barTopY() - 1;
    if (MENU_OPEN) {                 // 菜单开着：图标不放大；指针走出「菜单 ∪ 条」就关菜单
      IN_WIN = false; MX = -1e9; startRaf();
      var r = menuEl.getBoundingClientRect();
      var inMenu = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      if (!inMenu && !inBar) { closeMenu(); leaveDock(); }
      return;
    }
    // 常态下光标停在条**上方**的余量带里：不放大（窗口只有条高，放大会被顶边裁掉一截），
    // 等它真的压到条上（inBar）再长高 + 放大
    if (inBar || GROWN) { IN_WIN = true; MX = x; }
    else { IN_WIN = false; MX = -1e9; }
    startRaf();
    if (!GROWN) {
      if (inBar) setGrown(true);
    } else if (!inBar && !itemAtPoint(x, y)) {
      leaveDock();          // 余量区里、且不在放大图标上 → 缩回条高，那 28px 还给下面的窗口
    }
  };

  /* ── E3 余量按需存在：常态窗口**只有玻璃条那么高**（上方没有隐形挡鼠标的那 28px），
     鼠标压到条上才把窗口临时长高 28px，给放大图标腾出渲染空间；指针挪进余量区又不在放大图标上
     → 缩回条高，那 28px 立刻还给下面的窗口（点击真的落下去）。
     为什么不用 dock-plan §8 坑 1 的原方案（WM_NCHITTEST 返 HTTRANSPARENT）：实测 ① 鼠标在
     WebView2 子窗上方时顶层窗**根本收不到** WM_NCHITTEST；② HTTRANSPARENT 只对**同线程**窗口生效，
     穿透不到别的进程（浏览器/编辑器），等于白做 —— 两枪都记在 docs/dock-spike.md 坑 13 */
  function barTopY() { return (window.innerHeight || 0) - (SIZE + 16); }
  function itemAtPoint(x, y) {   // 按**视觉**矩形命中（放大后图标会顶出布局盒）
    var hit = null;
    Array.prototype.forEach.call(itemsEl.children, function (el) {
      if (hit) return;
      var r = el.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = el;
    });
    return hit;
  }
  function setGrown(on) {
    if (PREVIEW || GROWN_REQ === on) return;
    GROWN_REQ = on;
    if (T && T.core) {
      T.core.invoke('dock_hover', { grown: on }).then(function () { HOVER_N++; }, function (err) {
        HOVER_ERR = String(err && err.message ? err.message : err);
        GROWN_REQ = !on;
      });
    }
  }
  function leaveDock() {
    IN_WIN = false; MX = -1e9; startRaf(); setGrown(false);
  }
  if (PREVIEW) {   // 主界面里嵌的预览 iframe：几何固定、不接余量态，直接用自家 mousemove 驱动放大
    document.addEventListener('mousemove', function (e) { PT_N++; IN_WIN = true; MX = e.clientX; startRaf(); });
    document.documentElement.addEventListener('mouseleave', function () { IN_WIN = false; MX = -1e9; startRaf(); });
  }
  window.addEventListener('resize', function () {   // 窗口高变了 = 余量态变了（Rust 摆完窗口就发这一枪）
    GROWN = (window.innerHeight - (SIZE + 16)) > 2;
    GROWN_REQ = GROWN;
    applySizing();
  });

  /* ── 数据接入：首帧拉一次（事件推送走 Rust 的 eval __setDock） ── */
  var DGY = null;   // 诊断：最近一次 payload
  if (T && T.core) {
    T.core.invoke('get_dock').then(function (p) { DGY = p; window.__setDock(p); }).catch(function () {});
    // 磨砂：首帧先按 URL 的 blur 值糊上，dock_glass 回来再精确定位
    setBlur(params.get('blur') || 30);
    T.core.invoke('dock_glass').then(setWall).catch(function () {});
  }
  window.__getDGY = function () { return DGY; };

  /* ── 手势：拖空白移动整条；点图标 = 启动（C1）；右键菜单留 F 段 ── */
  var PREVIEW = params.get('preview') === '1';   // 主界面 iframe 预览：不接拖动/启动
  var holdTimer = null;
  function startDrag() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    var wa = T && T.window;
    if (wa && wa.getCurrentWindow) {
      try { wa.getCurrentWindow().startDragging(); } catch (err) { console.error(err); }
    }
  }
  var dockEl = document.getElementById('dock');
  dockEl.addEventListener('mousedown', function (e) {
    if (PREVIEW || e.button !== 0) return;
    // 图标上按下不拖整条（放大后的图标顶出布局盒，按视觉矩形兜底）
    if (e.target && e.target.closest && e.target.closest('.item')) return;
    if (itemAtPoint(e.clientX, e.clientY)) return;
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = setTimeout(startDrag, 150);
  });
  dockEl.addEventListener('mousemove', function () {
    if (!holdTimer) return;
    startDrag();
  });
  function cancelHold() { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }
  dockEl.addEventListener('mouseup', cancelHold);
  dockEl.addEventListener('mouseleave', cancelHold);

  /* ── C1：点图标 → 启动 + 跳一下 + 1.5s「启动中」气泡 ── */
  var bubbleEl = document.getElementById('bubble');
  var bubbleTimer = null;
  function bubble(text, item, ms) {
    if (!bubbleEl) return;
    bubbleEl.textContent = text;
    if (item) {
      var cx = item.offsetLeft + item.offsetWidth / 2;
      bubbleEl.style.left = cx + 'px';
    }
    bubbleEl.classList.add('on');
    if (bubbleTimer) clearTimeout(bubbleTimer);
    if (ms > 0) {
      bubbleTimer = setTimeout(function () { bubbleEl.classList.remove('on'); }, ms);
    }
  }
  function hideBubble() {
    if (bubbleEl) bubbleEl.classList.remove('on');
    if (bubbleTimer) { clearTimeout(bubbleTimer); bubbleTimer = null; }
  }
  /* 跳一下：CSS keyframes 一次性 —— 每次重放都靠「先摘类再强制回流」重触发（动画铁律） */
  function bounceOnce(el) {
    if (!el) return;
    el.classList.remove('launching');
    void el.offsetWidth;
    el.classList.add('launching');
    setTimeout(function () { el.classList.remove('launching'); }, 460);
  }
  itemsEl.addEventListener('mousedown', function (e) {
    // 图标上按下要拦住整条的拖动判定（含放大后顶出布局盒的视觉矩形）
    if (e.target && e.target.closest && e.target.closest('.item')) e.stopPropagation();
    else if (itemAtPoint(e.clientX, e.clientY)) e.stopPropagation();
  });
  itemsEl.addEventListener('click', function (e) {
    if (PREVIEW || !T || !T.core) return;
    if (SUPPRESS_CLICK) { SUPPRESS_CLICK = false; return; }   // 这一击只用来收菜单
    var el = e.target && e.target.closest ? e.target.closest('.item') : null;
    if (!el) el = itemAtPoint(e.clientX, e.clientY);   // 放大图标往上顶出布局盒：按视觉矩形兜底
    if (!el) return;
    var id = el.dataset.id;
    if (!id) return;
    el.classList.add('busy');
    T.core.invoke('dock_click', { id: id })
      .then(function (what) {
        if (what === 'launched') { bounceOnce(el); bubble('启动中…', el, 1500); }
        else if (what === 'minimized') { bubble('已最小化', el, 1200); }
        else if (what === 'activated') { bubble('已切到前台', el, 1200); }
        else { bubble('已在任务栏闪动', el, 1500); }
      })
      .catch(function (err) {
        bubble('失败：' + (err && err.message ? err.message : err), el, 2200);
      })
      .then(function () { el.classList.remove('busy'); });
  });
  itemsEl.addEventListener('mouseover', function (e) {
    if (PREVIEW || !e.target || !e.target.closest) return;
    var el = e.target.closest('.item');
    if (el && el.dataset.name) bubble(el.dataset.name, el, 0);
  });
  itemsEl.addEventListener('mouseout', function (e) {
    if (!e.target || !e.target.closest) return;
    if (e.target.closest('.item')) hideBubble();
  });

  /* ── F1 拖入标线：Rust 的 DragDrop 事件推 `__setDrop({index})`（Enter/Over 推，Drop/Leave 推 null）──
     位置 = 第 index 个槽（两个图标之间），与 Rust 侧 `insert_index_for_x` 同一套几何：
     图标 i 中心 = 12 + size/2 + i×(size+12)，槽在它左边缘外半个间距处 */
  var dropEl = document.getElementById('dropmark');
  window.__setDrop = function (p) {
    if (!dropEl) return;
    if (!p || typeof p.index !== 'number') { dropEl.hidden = true; return; }
    var n = itemsEl.children.length;
    var i = Math.max(0, Math.min(n, p.index | 0));
    var pitch = SIZE + 12;
    dropEl.dataset.i = String(i);
    dropEl.style.left = (12 + i * pitch - 6) + 'px';   // margin-left:-1px 让 2px 线居中落在槽上
    dropEl.hidden = false;
  };
  window.__getDrop = function () {
    return dropEl && !dropEl.hidden ? { index: Number(dropEl.dataset.i || -1), left: dropEl.offsetLeft } : null;
  };

  /* ── F2 右键菜单 ──
     菜单长在玻璃条**上方** —— 窗口只有条那么高，所以开菜单时把「需要的高度」报给 Rust
     （`dock_menu(open, extra)` → 窗口临时长高，条不动）。关闭路径：点项 / 点条上别处 /
     指针走出「菜单 ∪ 条」（页面只认 Rust 推来的真光标，见 __setPointer）。
     为什么不做失焦关闭：Dock 窗是 NOACTIVATE + 不可聚焦的，它根本收不到 blur（点桌面也不关）。 */
  var menuEl = document.getElementById('menu');
  var MENU_OPEN = false, MENU_ITEM = null;
  function isUrlPath(p) { return /^https?:\/\//i.test(p || ''); }
  function menuExtra(open, h) {
    if (PREVIEW || !T || !T.core) return;
    T.core.invoke('dock_menu', { open: !!open, extra: Number(h) || 0 }).catch(function () {});
  }
  function closeMenu() {
    if (!MENU_OPEN) return;
    MENU_OPEN = false; MENU_ITEM = null;
    menuEl.hidden = true; menuEl.innerHTML = '';
    menuExtra(false, 0);
  }
  function openMenu(itemEl, clientX) {
    var rows = itemEl
      ? [{ act: 'reveal', label: '打开所在文件夹' }, { act: 'remove', label: '从 Dock 移除' }, { act: 'cancel', label: '取消' }]
      : [{ act: 'add', label: '添加应用' }, { act: 'settings', label: 'Dock 设置' }];
    MENU_ITEM = itemEl || null;
    menuEl.innerHTML = '';
    rows.forEach(function (r) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mi' + (r.act === 'remove' ? ' danger' : '');   // 左空格 = 第二类名
      b.textContent = r.label;
      b.dataset.act = r.act;
      if (r.act === 'reveal' && itemEl && isUrlPath(itemEl.dataset.path)) b.disabled = true;  // 网址没有「所在文件夹」
      menuEl.appendChild(b);
    });
    menuEl.hidden = false;
    var winW = window.innerWidth || 0;
    var mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
    var ax = itemEl ? (itemEl.offsetLeft + itemEl.offsetWidth / 2) : clientX;   // 锚点：图标中心 / 空白处指针
    menuEl.style.left = Math.round(Math.max(8, Math.min(winW - 8 - mw, ax - mw / 2))) + 'px';
    MENU_OPEN = true;
    IN_WIN = false; MX = -1e9; startRaf();                                       // 菜单开着不放大
    // 长高量 = 菜单高 + 贴条 6 + 顶部留白 10（给投影一点余地）
    menuExtra(true, mh + 16);
  }
  window.__getMenu = function () {
    if (!MENU_OPEN) return { open: false, innerH: window.innerHeight, barTop: barTopY() };
    var r = menuEl.getBoundingClientRect();
    var first = menuEl.children[0];
    var cs = first ? window.getComputedStyle(first) : null;
    return {
      open: true, blank: !MENU_ITEM, id: MENU_ITEM ? (MENU_ITEM.dataset.id || '') : null,
      rows: Array.prototype.map.call(menuEl.children, function (b) { return b.textContent; }),
      rect: [+r.left.toFixed(1), +r.top.toFixed(1), +r.width.toFixed(1), +r.height.toFixed(1)],
      rowH: first ? first.offsetHeight : 0, rowPad: cs ? cs.paddingLeft : '',
      radius: window.getComputedStyle(menuEl).borderRadius,
      gapAboveBar: +(barTopY() - r.bottom).toFixed(1),
      innerH: window.innerHeight, barTop: barTopY(),
    };
  };
  document.addEventListener('contextmenu', function (e) {
    if (PREVIEW) { e.preventDefault(); return; }
    e.preventDefault();
    if (e.target && e.target.closest && e.target.closest('.menu')) return;   // 菜单自己身上右键 → 保持不动
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    var el = e.target && e.target.closest ? e.target.closest('.item') : null;
    if (!el) el = itemAtPoint(e.clientX, e.clientY);   // 放大图标顶出布局盒 → 按视觉矩形兜底
    openMenu(el, e.clientX);
  });
  /* 菜单开着时，窗内（条上）的任意按下都先当「关菜单」——第一次点只收菜单，不激活图标（跟系统菜单一致） */
  var SUPPRESS_CLICK = false;
  document.addEventListener('mousedown', function (e) {
    if (!MENU_OPEN) return;
    if (e.target && e.target.closest && e.target.closest('.menu')) return;
    closeMenu();
    SUPPRESS_CLICK = true;
  });
  menuEl.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.mi') : null;
    if (!b || b.disabled) return;
    var act = b.dataset.act, it = MENU_ITEM;
    closeMenu();
    if (act === 'cancel') return;
    if (!T || !T.core) return;
    if (act === 'reveal' && it) {
      T.core.invoke('dock_reveal', { path: it.dataset.path }).catch(function (err) { bubble('打开失败：' + err, it, 2000); });
    } else if (act === 'remove' && it) {
      T.core.invoke('dock_remove', { id: it.dataset.id }).catch(function (err) { bubble('移除失败：' + err, it, 2000); });
    } else if (act === 'add') {
      T.core.invoke('plugin:dialog|open', {
        options: {
          multiple: true, title: '选择要添加的应用',
          filters: [{ name: '程序 / 快捷方式', extensions: ['exe', 'lnk', 'bat', 'cmd'] }, { name: '所有文件', extensions: ['*'] }]
        }
      }).then(function (sel) {
        if (!sel) return;
        return T.core.invoke('dock_add', { paths: Array.isArray(sel) ? sel : [sel] });
      }).catch(function (err) { bubble('添加失败：' + err, itemsEl.children[0], 2000); });
    } else if (act === 'settings') {
      T.core.invoke('dock_open_settings').catch(function () {});
    }
  });

  /* ── F3 主界面预览（preview=1）：轮询 get_dock 与真条同源 ──
     主界面推 __setDock 是主路；这里补一条 1.5s 轮询 —— 预览是独立 iframe、看不见真条的
     __setRunning / 拖入结果，轮询能让「运行指示点 / 条目变化」自己跟上（两路都幂等）。 */
  if (PREVIEW) {
    setInterval(function () {
      if (!T || !T.core) return;
      if (document.visibilityState === 'hidden') return;   // 主界面切走了/最小化了就别轮询
      T.core.invoke('get_dock').then(function (p) { if (p) window.__setDock(p); }).catch(function () {});
    }, 1500);
  }

  applySizing();
})();
</script>
</body>
</html>
