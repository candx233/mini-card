[package]
name = "minicard-shell"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "mini-card 自绘外壳：窗口、DComp/D2D 设备、桌面层、读回取证"

[dependencies]
windows = { version = "0.62.2", default-features = false, features = [
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  # 独立构建 minicard-shell（`cargo test -p` 本 crate）时必需：WNDCLASSW/RegisterClassW
  # 带 HBRUSH/HICON 字段，windows-rs 把这两个符号门在 Gdi feature 后面。
  # 以前只有通过 minicard-bin 构建时被 bin 的 Gdi feature 顺带打开，standalone 编不过。
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"
