[package]
name = "minicard-bin"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "自绘卡进程（0.1.2 只会渲染性能卡；其余 8 张按 docs/TODO-012-renderer.md 逐张接）"

[[bin]]
name = "minicard-bin"
path = "src/main.rs"

[dependencies]
minicard-cards = { path = "../minicard-cards" }
minicard-core = { path = "../minicard-core" }
minicard-draw = { path = "../minicard-draw" }
minicard-shell = { path = "../minicard-shell" }
windows = { version = "0.62.2", default-features = false, features = [
  "Foundation",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Controls",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"
# #[implement] 展开时按字面量引用 windows_core，必须真有这个 crate 名
windows-core = "0.62.2"
# 图标 PNG 编码（解码走 WIC，编码只有 png 这一档要用）
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
